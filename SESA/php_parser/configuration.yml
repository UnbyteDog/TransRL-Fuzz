## 输出相关设置（新版/常用）
outputs:
  tainted_flow: true          # 是否包含污点流路径
  include_failures_file: ~    # 或设置为 "logs/failures.json"
  sarif_output: false         # 是否生成 SARIF 文件
  include_source_code: true   # 将源码片段包含在输出中
  source_code_context: 3      # 每个片段上下保留的行数
  json_output:
    enabled: true
    filename: "progpilot_results.json"


## 行为/性能选项
options:
  analyze_includes: true
  debug_mode: false
  pretty_print: true
  # 单个文件最大分析时长（秒），启用可避免卡在复杂文件
  max_file_analysis_duration: 30
  # 单个上下文允许的最大定义数（类/函数等），防止分析爆炸
  max_definitions: 500
  # 超过该字节数的文件将跳过分析
  max_file_size: 1000000